<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Simulasi</title>
<style>
  :root { --bg:#f1f2f4; --bg2:#e2e4e8; --card:#ffffff; --ink:#24272c; --muted:#62666e; --line:#d9dbe0; --accent:#3a3f47; --accent-ink:#ffffff; --gold:#c9a24a; --lock:#c9a24a; --err:#a3312a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181b; --bg2:#202328; --card:#25282d; --ink:#eef0f3; --muted:#a7abb3; --line:#383c43; --accent:#c9a24a; --accent-ink:#24272c; --gold:#d9b864; --lock:#24272c; --err:#ff8a80; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100vh; }
  body { background:radial-gradient(1200px 600px at 50% -10%, var(--bg2), var(--bg)); color:var(--ink); font:16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:420px; margin:auto; background:var(--card); border:1px solid var(--line); border-top:3px solid var(--gold); border-radius:16px; padding:34px 28px 28px; box-shadow:0 18px 50px rgba(0,0,0,.14); text-align:center; }
  .badge { width:58px; height:58px; border-radius:50%; background:var(--accent); color:var(--lock); display:grid; place-items:center; margin:0 auto 16px; box-shadow:0 0 0 6px rgba(201,162,74,.15); }
  h1 { font-size:1.4rem; margin:0 0 24px; letter-spacing:.01em; }
  p { margin:0 0 22px; color:var(--muted); font-size:.95rem; }
  form, #g { text-align:left; }
  label { display:block; font-weight:600; font-size:.9rem; margin-bottom:6px; }
  input[type=password], input[type=text] { width:100%; padding:12px 14px; font-size:1rem; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--ink); letter-spacing:.06em; text-align:center; }
  input:focus { outline:2px solid var(--gold); outline-offset:1px; border-color:transparent; }
  input[type=checkbox] { accent-color:var(--accent); }
  .row { display:flex; align-items:center; gap:8px; margin:12px 0 18px; font-size:.9rem; color:var(--muted); }
  button { width:100%; padding:12px; font-size:1rem; font-weight:600; letter-spacing:.02em; border:0; border-radius:10px; background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  button:disabled { opacity:.6; cursor:wait; }
  .msg { min-height:1.4em; margin-top:12px; font-size:.9rem; color:var(--err); text-align:center; }
  .msg.info { color:var(--muted); }
</style>
</head>
<body>
<main class="card">
  <div class="badge" aria-hidden="true">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </div>
  <h1>Simulasi</h1>
  <form id="f" autocomplete="off">
    <label for="kode">Kode akses</label>
    <input id="kode" type="password" required autofocus spellcheck="false" autocapitalize="characters">
    <div class="row"><input id="ingat" type="checkbox" checked><label for="ingat" style="margin:0;font-weight:400">Ingat di perangkat ini</label></div>
    <button id="btn" type="submit">Masuk</button>
    <div id="msg" class="msg" role="status"></div>
  </form>
  <div id="g" hidden>
    <p style="margin-top:4px"><b style="color:var(--ink)">Satu langkah lagi.</b> Masuk dengan akun Google Anda. Ini hanya sekali di perangkat ini, dan nama Anda tidak ditampilkan ke peserta lain.</p>
    <div id="gBtn" style="display:flex;justify-content:center;min-height:44px"></div>
    <div id="gMsg" class="msg" role="status"></div>
  </div>
</main>
<script>
(function(){
  var SIMPAN = 'akses-simulasi-kode', GOOGLE_ID = '__GOOGLE_CLIENT_ID__', GSIMPAN = 'akses-simulasi-google';
  var f = document.getElementById('f'), kode = document.getElementById('kode'),
      ingat = document.getElementById('ingat'), btn = document.getElementById('btn'), msg = document.getElementById('msg');
  function lapor(t, info){ msg.textContent = t; msg.className = 'msg' + (info ? ' info' : ''); }
  function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function rapikan(k){ return (k || '').trim().toUpperCase(); }
  function ambil(k){ try { return k === undefined ? localStorage.getItem(SIMPAN) : (k === null ? localStorage.removeItem(SIMPAN) : localStorage.setItem(SIMPAN, k)); } catch(e){ return null; } }

  if (!window.crypto || !crypto.subtle) { lapor('Browser ini tidak mendukung. Gunakan Chrome, Edge, Firefox, atau Safari versi terbaru.'); btn.disabled = true; return; }
  if (/[?&]keluar\b/.test(location.search)) { ambil(null); try { localStorage.removeItem(GSIMPAN); } catch(e) {} history.replaceState(null, '', location.pathname); }

  // Login Google (Google Identity Services) hanya untuk mengambil nama tampilan; izin masuk tetap dari kode akses.
  function google(){
    var ada = null; try { ada = JSON.parse(localStorage.getItem(GSIMPAN) || 'null'); } catch(e) {}
    function pakai(g){ try { sessionStorage.setItem('sts-gn', g.n || ''); sessionStorage.setItem('sts-ge', g.e || ''); } catch(e) {} }
    if (!/apps\.googleusercontent\.com$/.test(GOOGLE_ID)) return Promise.resolve();
    if (ada && ada.n) { pakai(ada); return Promise.resolve(); }
    return new Promise(function(selesai){
      f.hidden = true; document.getElementById('g').hidden = false;
      var gm = document.getElementById('gMsg');
      var sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
      sc.onerror = function(){ gm.textContent = 'Gagal memuat login Google. Periksa koneksi lalu muat ulang halaman.'; };
      sc.onload = function(){
        google_accounts().initialize({ client_id: GOOGLE_ID, auto_select: true, callback: function(r){
          try {
            var bag = r.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            var o = JSON.parse(new TextDecoder().decode(b64(bag + '==='.slice((bag.length + 3) % 4))));
            var g = { n: String(o.name || o.given_name || '').slice(0, 50), e: String(o.email || '').slice(0, 80) };
            try { localStorage.setItem(GSIMPAN, JSON.stringify(g)); } catch(e) {}
            pakai(g); document.getElementById('g').hidden = true; lapor('Memuat aplikasi…', true); f.hidden = false; selesai();
          } catch(e) { gm.textContent = 'Login Google gagal. Coba lagi.'; }
        }});
        google_accounts().renderButton(document.getElementById('gBtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'id' });
      };
      document.head.appendChild(sc);
    });
  }
  function google_accounts(){ return window.google.accounts.id; }

  async function buka(teks){
    var enc = new TextEncoder();
    var r = await fetch('kunci.json', {cache:'no-store'});
    if (!r.ok) throw new Error('jaringan');
    var K = await r.json();
    var bahan = await crypto.subtle.importKey('raw', enc.encode(rapikan(teks)), 'PBKDF2', false, ['deriveKey']);
    var kunciKode = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(K.salt), iterations:K.iter, hash:'SHA-256'}, bahan, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var utama = null;
    for (var i = 0; i < K.daftar.length && !utama; i++) {
      try { utama = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(K.daftar[i].iv)}, kunciKode, b64(K.daftar[i].c)); } catch(e) {}
    }
    if (!utama) return false;
    lapor('Kode benar. Memuat aplikasi…', true);
    var bU = new Uint8Array(utama), kunciRaw = bU.slice(0, 32), sisa = new TextDecoder().decode(bU.slice(32)), info;
    try { info = JSON.parse(sisa); } catch(e) { info = {l: sisa}; }
    try { sessionStorage.setItem('sts-k', btoa(String.fromCharCode.apply(null, kunciRaw))); sessionStorage.setItem('sts-l', info.l || '');
          if (info.p) sessionStorage.setItem('sts-p', JSON.stringify(info.p)); else sessionStorage.removeItem('sts-p'); } catch(e) {}
    await google();
    var kunciIsi = await crypto.subtle.importKey('raw', kunciRaw, 'AES-GCM', false, ['decrypt']);
    var rk = await fetch('konten.enc?v=' + encodeURIComponent(K.versi || ''), {cache:'no-store'});
    if (!rk.ok) throw new Error('jaringan');
    var data = new Uint8Array(await rk.arrayBuffer());
    var html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:data.slice(0, 12)}, kunciIsi, data.slice(12)));
    try { localStorage.setItem('skb-panduan', '1'); } catch(e) {}  // panduan selalu menyala saat masuk
    document.open(); document.write(html); document.close();
    return true;
  }

  async function coba(teks, otomatis){
    btn.disabled = true; lapor('Memeriksa kode…', true);
    try {
      var ok = await buka(teks);
      if (ok) { if (ingat.checked || otomatis) ambil(rapikan(teks)); return; }
      if (otomatis) { ambil(null); lapor('Kode yang tersimpan sudah tidak berlaku. Masukkan kode baru.'); }
      else lapor('Kode akses tidak dikenal. Periksa lagi atau minta kode kepada pemilik.');
    } catch(e) {
      lapor('Gagal memuat. Periksa koneksi internet lalu coba lagi.');
    }
    btn.disabled = false; kode.focus();
  }

  f.addEventListener('submit', function(e){ e.preventDefault(); if (!ingat.checked) ambil(null); coba(kode.value, false); });
  var dariLink = (location.hash.match(/[#&]k=([^&]+)/) || [])[1];
  if (dariLink) { history.replaceState(null, '', location.pathname); kode.value = decodeURIComponent(dariLink); ingat.checked = true; coba(kode.value, false); }
  else { var tersimpan = ambil(); if (tersimpan) coba(tersimpan, true); }
})();
</script>
</body>
</html>
